[project]
name = "weida"
version = "0.1.0"
description = "Four-stage WEiDA analysis with cross-language validation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.11.2",
    "phyid",
]

[tool.uv]
package = false
required-version = ">=0.11.28"

[tool.uv.sources]
phyid = { git = "https://github.com/Imperial-MIND-lab/integrated-info-decomp.git", rev = "6c5f2e9d33c985efbdf875d45cb5a2a6a5cdbf44" }
