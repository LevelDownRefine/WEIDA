[project]
name = "weida"
version = "0.1.0"
description = "Four-stage WEiDA analysis with cross-language validation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.11.2",
    "weida-preprocessing",
    "weida-postprocessing",
]

[tool.uv]
package = false
required-version = ">=0.11.28"

[tool.uv.workspace]
members = [
    "common/preprocessing",
    "common/postprocessing",
]

[tool.uv.sources]
weida-preprocessing = { workspace = true }
weida-postprocessing = { workspace = true }
