name: WEiDA 测试与验证
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python-unit:
    name: Python 单元测试
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: uvx ruff==0.17.6 check .
      - run: uv run --locked python -m unittest discover -s tests -t . -v
  octave-reference:
    name: Octave 跨语言对照
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          enable-cache: true
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave octave-signal octave-statistics gnuplot-nox fonts-freefont-otf
      - run: uv run --locked python validation/compare.py --octave /usr/bin/octave --output validation_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octave-reference-report
          path: validation_output/
