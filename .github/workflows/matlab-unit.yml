name: MATLAB unit and original preprocessing parity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out original MATLAB reference
        uses: actions/checkout@v4
        with:
          repository: chenfei-ye/WEIDA-DBS
          ref: 2e20b0bc956e6eb0eb8e06e2aaf00a93b014e72c
          path: .reference/WEIDA-DBS
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.28'
      - run: uv sync --locked
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Signal_Processing_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: results = runtests('tests/matlab'); disp(table(results)); assertSuccess(results)
